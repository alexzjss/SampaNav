<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <title>Piso paulista (tile contínuo 4×4)</title>
  <defs><pattern id="piso" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#F5F3EE"/><polygon points="-2,-2 -1,-2 0,-1 1,-1 0,0 -1,0 -2,-1 -3,-1" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="2,-2 3,-2 4,-1 5,-1 4,0 3,0 2,-1 1,-1" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="0,0 1,0 2,1 3,1 2,2 1,2 0,1 -1,1" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="4,0 5,0 6,1 7,1 6,2 5,2 4,1 3,1" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="-2,2 -1,2 0,3 1,3 0,4 -1,4 -2,3 -3,3" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="2,2 3,2 4,3 5,3 4,4 3,4 2,3 1,3" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="0,4 1,4 2,5 3,5 2,6 1,6 0,5 -1,5" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/><polygon points="4,4 5,4 6,5 7,5 6,6 5,6 4,5 3,5" fill="#111111" stroke="#111111" stroke-width="0.02" stroke-linejoin="miter"/></pattern></defs>
  <rect width="32" height="32" fill="url(#piso)"/>
</svg>
