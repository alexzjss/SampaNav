[project]
name = "sampanav"
version = "1.3.0"
description = "Roteamento seguro a pé e de carro na cidade de São Paulo"
requires-python = ">=3.11"
# Só o necessário para a API (é o que vai para o container de deploy).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "numpy",
    "pyarrow",
    "h3>=4",
    "python-igraph",
    "scipy",
]

[dependency-groups]
# Pipeline offline (planilhas da SSP, OSM, agregação de risco).
pipeline = [
    "pandas",
    "openpyxl",
    "osmnx>=2",
    "shapely",
]
dev = [
    "pytest",
    "ruff>=0.17.2",
]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    # TestClient do Starlette 1.x prefere httpx2; o httpx de produção (geocode) segue o mesmo para os testes
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
